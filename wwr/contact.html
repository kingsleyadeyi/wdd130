<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids White Water Rafting</title>
    <meta name="description"
      content="Contact Rapids White Water Rafting for reservations, trip information, customer support, and general inquiries.">
    <meta name="author" content="Kingsley Adeyi James">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/therapids.jpg" alt="The Rapids Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">

            <h1>Rapids White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@therapids.com</p>

        </section>

        <section class="contact-grid">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086730128667!2d-122.419415!3d37.774929!2m3!1f0!2f0!3f0!2m3!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064dfad8b93%3A0x6d2b6f8f8c6f1b3d!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1710000000000"
                  allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p><strong>Message Purpose</strong></p>

                <label>
                    <input type="radio" name="purpose" value="general" checked>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="website">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get In Touch!</button>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee2.jpg" alt="Operations Manager">
                    <figcaption>Sarah Johnson - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>Anu West - Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer Service Manager">
                    <figcaption>Mitchel Brown - Customer Service Manager</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 The Rapids White Water Rafting Company | Kingsley Adeyi
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://x.com">
                <img src="images/x-bw.svg" alt="X">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
