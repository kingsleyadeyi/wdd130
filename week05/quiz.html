<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form>

            <div class="form-item">
                <label for="q1">1. What does CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="form-item">
                <label for="q2">2. Explain the difference between an id selector and a class
                    selector in CSS.</label>
                <textarea id="q2" name="q2" rows="5"></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which HTML element is used to create a hyperlink?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">&lt;a&gt;</option>
                    <option value="link">&lt;link&gt;</option>
                    <option value="href">&lt;href&gt;</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>

</html>
